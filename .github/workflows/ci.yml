name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      RECEPTIONIST_APP_ENV: ci
      RECEPTIONIST_DATABASE_URL: postgresql+psycopg://receptionist:receptionist@localhost:5432/receptionist_test
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: receptionist_test
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receptionist -d receptionist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: 3.12.15

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.2"

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      - name: Strict mypy
        run: make typecheck

      - name: Fail-closed secret scan
        run: make secrets

      - name: Dependency audit
        run: make audit

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: uv run pytest -m integration tests/integration

      - name: Alembic verification
        run: >-
          uv run python -c 'from alembic import command; from alembic.config import Config; from receptionist.core.config import Settings, assert_safe_test_database; settings = Settings(_env_file=None); assert_safe_test_database(settings); config = Config("alembic.ini"); command.upgrade(config, "head"); command.downgrade(config, "base"); command.upgrade(config, "head")'

      - name: Validate Compose configuration
        run: docker compose --profile test config

      - name: Build backend image
        run: docker build -t arabic-english-ai-receptionist:ci .

