[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "arabic-english-ai-receptionist"
version = "0.1.0"
description = "Engineering foundation for an Arabic-English AI receptionist portfolio project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.142.2,<1",
    "google-api-python-client>=2.181,<3",
    "google-auth>=2.40,<3",
    "google-auth-httplib2>=0.2,<1",
    "phonenumbers>=9.0.40,<10",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "uvicorn[standard]>=0.53,<1",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5,<2",
    "httpx>=0.28.1,<1",
    "mypy>=2.4,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.10,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/receptionist"]

[tool.uv]
required-version = ">=0.12.22,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = ["--strict-config", "--strict-markers", "--cov=receptionist", "--cov-report=term-missing", "-ra"]
asyncio_mode = "auto"
markers = [
    "unit: tests that do not require PostgreSQL, Docker, network access, or external providers",
    "integration: tests that require the isolated PostgreSQL test service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
